<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/Justicon-Free-Simple-Line-Arrow-Solution-Business-Computer-Technology.512 (1).png" type="image/x-icon">
    <link
    href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'> 
    <link rel="stylesheet" href="styles.css">
    
    <title>Gustavo-Login</title>
    

</head>
<body>
    <main class="container">
        <form>
            <h1>Login</h1>
            <div class="input-box">
                <input placeholder="Usuário" type="email"> 
                <i class="bx bxs-user"></i>
           </div>

            
            <div class="input-box">
                <input placeholder="Senha" type="password">
                <i class="bx bxs-lock-alt"></i>
           </div>

           <div class="remember-forgot">
                <label>
                    <input type="checkbox">
                    Lembrar minha senha
                </label>
                <a href="#">Esqueci minha senha</a>
           </div>

           <button type="submit" class="login">Login</button>

           <div class="register-link">
            <p>Não tem uma conta? <a href="#">cadastre-se</a></p>
           </div>
        
        
        </form>

        <div class="contact">
            <p>Entre em contato</p>

            <a
                href="https://www.linkedin.com/in/gustavo-sales-a25662257/"
                target="_blank"
                rel="noopener noreferrer"
            >
                <i class="bx bxl-linkedin-square"></i>
                LinkedIn
            </a>
        </div>

    </main>

</body>
</html>
